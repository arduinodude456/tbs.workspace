<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TBS Workspace</title>
    <style>
        /* Entfernt Standard-Ränder und sorgt für volle Höhe des Dokuments */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Verhindert Scrollbalken auf der Hauptseite */
            background-color: #000000; /* Optional: Schwarzer Hintergrund während des Ladens */
        }

        /* Lässt den IFrame den gesamten Bildschirm ausfüllen */
        iframe {
            width: 100%;
            height: 100%;
            border: none; /* Entfernt den Standard-Rahmen des IFrames */
            display: block; /* Verhindert unerwünschte Abstände am unteren Rand */
        }
    </style>
</head>
<body>

    <iframe src="https://tbsworkspace-5eudmx5k.manus.space/" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>

</body>
</html>
